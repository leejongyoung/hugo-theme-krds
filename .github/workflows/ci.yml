name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Scan attachment files for viruses (first time only)
        uses: ./attachment-scan
        with:
          source: exampleSite/static/assets/files
          manifest: exampleSite/data/attachment_scan.json
      - name: Generate document preview PDFs
        uses: ./document-previews
        with:
          source: exampleSite/static/assets/files
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Hugo Extended
        env:
          HUGO_ASSET_ID: "682125110"
          HUGO_SHA256: c41672a0725d307758a132bc94a962e59760eb33f9ba08c991b81f9881d6fa7d
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --output /tmp/hugo.tar.gz \
            "https://api.github.com/repos/gohugoio/hugo/releases/assets/${HUGO_ASSET_ID}"
          echo "${HUGO_SHA256}  /tmp/hugo.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install /tmp/hugo /usr/local/bin/hugo
          hugo version
      - name: Resolve Hugo module
        working-directory: exampleSite
        run: hugo mod graph
      - name: Build example site
        working-directory: exampleSite
        run: hugo --gc --minify --panicOnWarning

  # theme.toml의 min_version으로 예제 사이트가 실제로 빌드되는지 확인한다.
  # 최신 버전은 위의 build-example이 검증한다. 무거운 단계(바이러스 검사, 문서 변환)는 버전과 무관해 생략한다.
  build-min-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Hugo Extended (minimum supported version)
        env:
          HUGO_VERSION: 0.158.0
          HUGO_ASSET_ID: "375150151"
          HUGO_SHA256: c2a724ac3c8e949fca56dd438b868b2128837754420c20a6e7ae345616c4e625
          GH_TOKEN: ${{ github.token }}
        run: |
          min=$(sed -n 's/^min_version = "\(.*\)"/\1/p' theme.toml)
          if [ "${min}" != "${HUGO_VERSION}" ]; then
            echo "theme.toml min_version (${min}) differs from the version tested here (${HUGO_VERSION}); update both." >&2
            exit 1
          fi
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --output /tmp/hugo.tar.gz \
            "https://api.github.com/repos/gohugoio/hugo/releases/assets/${HUGO_ASSET_ID}"
          echo "${HUGO_SHA256}  /tmp/hugo.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install /tmp/hugo /usr/local/bin/hugo
          hugo version
      - name: Resolve Hugo module
        working-directory: exampleSite
        run: hugo mod graph
      - name: Build example site with the minimum Hugo version
        working-directory: exampleSite
        run: hugo --gc --minify --panicOnWarning

  # Hugo·Jekyll 두 테마에서 같아야 하는 파일이 어긋나지 않았는지 본다. 지금은 경고(주석)만 남기고 실패시키지 않는다.
  shared-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compare shared files with the sibling theme (warning only)
        run: python3 script/check-shared.py
