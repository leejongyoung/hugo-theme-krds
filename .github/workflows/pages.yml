name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Scan attachment files for viruses (first time only)
        uses: ./attachment-scan
        with:
          source: exampleSite/static/assets/files
          manifest: exampleSite/data/attachment_scan.json
      - name: Generate document preview PDFs
        uses: ./document-previews
        with:
          source: exampleSite/static/assets/files
      - uses: actions/configure-pages@v6
        id: pages
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Hugo Extended
        env:
          HUGO_ASSET_ID: "682125110"
          HUGO_SHA256: c41672a0725d307758a132bc94a962e59760eb33f9ba08c991b81f9881d6fa7d
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --output /tmp/hugo.tar.gz \
            "https://api.github.com/repos/gohugoio/hugo/releases/assets/${HUGO_ASSET_ID}"
          echo "${HUGO_SHA256}  /tmp/hugo.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install /tmp/hugo /usr/local/bin/hugo
          hugo version
      - name: Build demo site
        working-directory: exampleSite
        run: hugo --gc --minify --panicOnWarning --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: exampleSite/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
