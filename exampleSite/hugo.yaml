baseURL: https://leejongyoung.github.io/hugo-theme-krds/
title: KRDS Hugo 테마 예제
locale: ko-KR
defaultContentLanguage: ko
enableRobotsTXT: true
summaryLength: 30

module:
  imports:
    - path: github.com/leejongyoung/hugo-theme-krds

pagination:
  pagerSize: 3

taxonomies:
  tag: tags

outputs:
  home: [HTML, RSS, JSON]


markup:
  highlight:
    style: github-dark
params:
  description: 범정부 UI/UX 디자인시스템(KRDS)을 바탕으로 만든 접근성 중심 Hugo 테마입니다.
  footer:
    description: Hugo Module로 설치하는 KRDS 기반 테마 예제 사이트입니다.
    copyright: hugo-theme-krds
    contact:
      - label: 저장소
        value: github.com/leejongyoung/hugo-theme-krds

menus:
  main:
    - name: 소개
      pageRef: /about
      weight: 10
    - name: 문서
      pageRef: /docs
      identifier: docs
      weight: 20
    - name: 시작하기
      pageRef: /docs/getting-started
      parent: docs
      weight: 21
    - name: 설정
      pageRef: /docs/configuration
      parent: docs
      weight: 22
    - name: 콘텐츠 작성
      pageRef: /docs/content
      parent: docs
      weight: 23
    - name: 태그와 검색
      pageRef: /docs/search-tags
      parent: docs
      weight: 24
    - name: 블로그
      pageRef: /blog
      weight: 30
    - name: 태그
      pageRef: /tags
      weight: 40
