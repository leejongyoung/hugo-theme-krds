baseURL: https://leejongyoung.github.io/hugo-theme-krds/
title: KRDS 테마 예제
locale: ko-KR
defaultContentLanguage: ko
enableRobotsTXT: true
summaryLength: 30

module:
  imports:
    - path: github.com/leejongyoung/hugo-theme-krds

pagination:
  pagerSize: 3

taxonomies:
  tag: tags

outputs:
  home: [HTML, RSS, JSON]

markup:
  highlight:
    style: github-dark
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']

params:
  description: 범정부 UI/UX 디자인시스템(KRDS)을 바탕으로 한 Hugo 테마의 예제 사이트입니다.
  footer:
    description: hugo-theme-krds 예제 사이트입니다.
    copyright: hugo-theme-krds
    contact:
      - label: 저장소
        value: github.com/leejongyoung/hugo-theme-krds
  krds:
    search:
      ai: true   # AI에게 물어보기(선택): 무료 웹 챗봇(ChatGPT·Gemini·Claude)으로 질문을 넘깁니다. 기본 꺼짐
    wiki:
      repo: leejongyoung/hugo-theme-krds
      branch: main
      contentDir: exampleSite/content

menus:
  utility:
    - name: GitHub
      url: https://github.com/leejongyoung/hugo-theme-krds
      weight: 10
  footer:
    - name: KRDS 누리집
      url: https://www.krds.go.kr
      weight: 10
  main:
    - name: 소개
      pageRef: /about
      weight: 10
    - name: 문서
      pageRef: /docs
      identifier: main-docs
      weight: 20
    - name: 시작하기
      pageRef: /docs/getting-started
      parent: main-docs
      weight: 21
    - name: 설정
      pageRef: /docs/configuration
      parent: main-docs
      weight: 22
    - name: 마크다운 보기
      pageRef: /docs/typography
      parent: main-docs
      weight: 23
    - name: 임베드와 수식
      pageRef: /docs/embeds
      parent: main-docs
      weight: 24
    - name: 첨부 파일
      pageRef: /docs/attachments
      parent: main-docs
      weight: 25
    - name: 태그와 검색
      pageRef: /docs/search-tags
      parent: main-docs
      weight: 26
    - name: 아이콘
      pageRef: /docs/icons
      parent: main-docs
      weight: 27
    - name: 홈 화면 꾸미기
      pageRef: /docs/home
      parent: main-docs
      weight: 28
    - name: 블로그
      pageRef: /blog
      weight: 30
    - name: 태그
      pageRef: /tags
      weight: 40
    - name: 위키
      pageRef: /wiki
      weight: 50
  docs:
    - name: 시작하기
      identifier: docs-start
      weight: 10
    - name: 소개
      pageRef: /docs
      parent: docs-start
      weight: 11
    - name: 설치와 시작
      pageRef: /docs/getting-started
      parent: docs-start
      weight: 12
    - name: 사용법
      identifier: docs-usage
      weight: 20
    - name: 설정
      pageRef: /docs/configuration
      parent: docs-usage
      weight: 21
    - name: 마크다운 보기
      pageRef: /docs/typography
      parent: docs-usage
      weight: 22
    - name: 임베드와 수식
      pageRef: /docs/embeds
      parent: docs-usage
      weight: 23
    - name: 첨부 파일
      pageRef: /docs/attachments
      parent: docs-usage
      weight: 24
    - name: 태그와 검색
      pageRef: /docs/search-tags
      parent: docs-usage
      weight: 25
    - name: 아이콘
      pageRef: /docs/icons
      parent: docs-usage
      weight: 26
    - name: 홈 화면 꾸미기
      pageRef: /docs/home
      parent: docs-usage
      weight: 27
