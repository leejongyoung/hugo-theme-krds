{{- $src := .Get "src" -}}{{- $srcURL := $src -}}{{- if not (strings.HasPrefix $src "http") }}{{ $srcURL = strings.TrimPrefix "/" $src | relURL }}{{ end -}}{{- $ratio := .Get "ratio" -}}{{- if and $ratio (not (findRE `^[0-9.]+\s*/\s*[0-9.]+$` $ratio)) }}{{ $ratio = "" }}{{ end -}}
<figure class="th-embed th-embed-media"><video class="th-embed-video" controls preload="metadata" playsinline{{ with .Get "poster" }} poster="{{ strings.TrimPrefix "/" . | relURL }}"{{ end }}{{ with .Get "title" }} aria-label="{{ . }}"{{ end }}{{ with $ratio }} style="--th-embed-ratio: {{ . }}"{{ end }}><source src="{{ $srcURL }}" type="{{ .Get "type" | default "video/mp4" }}">{{ with .Get "src2" }}{{ $url := . }}{{ if not (strings.HasPrefix . "http") }}{{ $url = strings.TrimPrefix "/" . | relURL }}{{ end }}<source src="{{ $url }}" type="{{ $.Get "type2" | default "video/webm" }}">{{ end }}{{ with .Get "captions" }}<track kind="captions" src="{{ strings.TrimPrefix "/" . | relURL }}" srclang="{{ $.Get "lang" | default "ko" }}" label="{{ $.Get "label" | default "한국어" }}" default>{{ end }}<a href="{{ $srcURL }}">동영상 내려받기</a></video>{{ with .Get "caption" }}<figcaption class="th-embed-caption">{{ . }}</figcaption>{{ end }}</figure>
