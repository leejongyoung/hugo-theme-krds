{{- $src := .Get "src" -}}{{- $srcURL := $src -}}{{- if not (strings.HasPrefix $src "http") }}{{ $srcURL = strings.TrimPrefix "/" $src | relURL }}{{ end -}}<figure class="th-embed th-embed-media th-embed-audio"><audio controls preload="metadata"{{ with .Get "title" }} aria-label="{{ . }}"{{ end }}><source src="{{ $srcURL }}" type="{{ .Get "type" | default "audio/mpeg" }}"><a href="{{ $srcURL }}">오디오 내려받기</a></audio><figcaption class="th-embed-caption">{{ .Get "caption" | default (.Get "title") }}{{ with .Get "transcript" }} · <a href="{{ strings.TrimPrefix "/" . | relURL }}">대본 보기</a>{{ end }}</figcaption></figure>
