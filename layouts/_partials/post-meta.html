<div class="th-meta"><time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006.01.02" }}</time>{{ with .Params.author }}<span>{{ . }}</span>{{ end }}{{ with .Params.tags }}<div class="krds-tag-wrap small">{{ range . }}{{ with site.GetPage (printf "/tags/%s" (. | urlize)) }}<a href="{{ .RelPermalink }}" class="krds-btn-tag link">{{ .LinkTitle }}</a>{{ end }}{{ end }}</div>{{ end }}</div>
