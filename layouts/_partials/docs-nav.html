{{ with site.GetPage "/docs" }}
<nav class="docs-nav" aria-label="문서 메뉴">
  <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
  <ul>
    {{ range .Pages.ByWeight }}
    <li><a href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>{{ .LinkTitle }}</a></li>
    {{ end }}
  </ul>
</nav>
{{ end }}
