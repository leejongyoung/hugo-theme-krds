{{ define "main" }}<div class="th-wrap">{{ partial "breadcrumb.html" . }}<h1 class="th-page-title">{{ .Title }}</h1><ul class="th-post-list">{{ range .Paginator.Pages }}<li class="th-post-item"><h2 class="th-post-title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>{{ partial "post-meta.html" . }}<p class="th-excerpt">{{ .Summary | plainify | truncate 140 }}</p></li>{{ end }}</ul>{{ partial "pagination.html" . }}</div>{{ end }}
