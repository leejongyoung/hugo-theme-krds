{{ define "main" }}
<div class="container page-shell">
  {{ partial "breadcrumb.html" . }}
  <header class="list-header"><p class="eyebrow">태그</p><h1>#{{ .Title }}</h1></header>
  <ul class="post-list">{{ range .Paginator.Pages }}<li><h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>{{ partial "post-meta.html" . }}<p>{{ .Summary }}</p></li>{{ end }}</ul>
  {{ partial "pagination.html" . }}
</div>
{{ end }}
